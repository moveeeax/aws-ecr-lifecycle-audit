[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ecr-lifecycle-audit"
version = "0.1.0"
description = "Audit ECR repositories offline for missing lifecycle policies, unreachable rules and untagged-image bloat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "ecr", "lifecycle", "cost", "audit", "devops"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aws-ecr-lifecycle-audit = "ecr_lifecycle_audit.cli:run"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-ecr-lifecycle-audit"
Source = "https://github.com/moveeeax/aws-ecr-lifecycle-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
